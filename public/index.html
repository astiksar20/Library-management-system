/* ================= Import / export ================= */
function csv(rows){ return rows.map(r=>r.map(v=>{ v=String(v??''); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\r\n'); }
function parseCSV(t){ const rows=[]; let row=[], f='', q=false; t=t.replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){ const c=t[i]; if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(f); f=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; } else f+=c; }
  if(f||row.length){ row.push(f); rows.push(row); } return rows.filter(r=>r.some(x=>x.trim())); }
async function giveFile(name,text){ if(downloads){ try{ await downloads.save({filename:name,data:text}); return; }catch(e){ const c=String(e&&(e.code||e.message)||''); if(/declin|cancel|denied|abort/i.test(c)) return; } }
  openModal('Export: '+name, `<p class="note" style="margin-top:0">Copy this text and save it as <b>${esc(name)}</b> (or paste it into a spreadsheet).</p><textarea id="exptext" rows="12" readonly style="font-family:ui-monospace,monospace;font-size:12px">${esc(text)}</textarea>
   <div class="form-actions"><button class="btn" data-act="close">Close</button><button class="btn pri" data-act="copy-exp">Copy to clipboard</button></div>`, true); }
function exportCSV(k){ const d=isoDate(new Date()); let rows;
  if(k==='books') rows=[['Code','Title','Author','ISBN','Category','Publisher','Year','Edition','Shelf','Copies','Available','Price','Times borrowed']].concat(books().sort((a,b)=>a.code<b.code?-1:1).map(b=>[b.code,b.title,b.author,b.isbn,b.category,b.publisher,b.year,b.edition,b.shelf,b.copies,avail(b),b.price,loans().filter(l=>l.bookId===b.id).length]));
  if(k==='members') rows=[['Code','Name','Type','Status','Email','Phone','Address','ID no.','Department','Joined','Expires','Books on loan','Fines owed']].concat(members().sort((a,b)=>a.code<b.code?-1:1).map(m=>[m.code,m.name,m.type,memberStatus(m)[0],m.email,m.phone,m.address,m.ref,m.dept,isoDate(m.joinedAt),isoDate(m.expiresAt),memberLoans(m.id).length,memberBal(m.id)]));
  if(k==='loans') rows=[['Book code','Title','Member code','Member','Issued','Due','Returned','Renewals','Status','Fine','Paid','Waived','Balance']].concat(loans().sort((a,b)=>a.issuedAt<b.issuedAt?1:-1).map(l=>[B(l.bookId)?.code,bTitle(l.bookId),M(l.memberId)?.code,mName(l.memberId),isoDate(l.issuedAt),isoDate(l.dueAt),l.returnedAt?isoDate(l.returnedAt):'',l.renewals||0,l.lost?'Lost':l.returnedAt?'Returned':isOverdue(l)?'Overdue':'On loan',fineOf(l),num(l.paid),num(l.waived),balOf(l)]));
  if(k==='overdue') rows=[['Member code','Member','Phone','Email','Book','Due','Days overdue','Fine so far']].concat(activeLoans().filter(isOverdue).sort((a,b)=>a.dueAt<b.dueAt?-1:1).map(l=>[M(l.memberId)?.code,mName(l.memberId),M(l.memberId)?.phone,M(l.memberId)?.email,bTitle(l.bookId),isoDate(l.dueAt),overdueDays(l),lateFine(l)]));
  if(k==='fines') rows=[['Member code','Member','Book','Reason','Fine','Paid','Waived','Balance','Status']].concat(loans().filter(l=>fineOf(l)>0).map(l=>[M(l.memberId)?.code,mName(l.memberId),bTitle(l.bookId),(l.lost?'Lost ':'')+(overdueDays(l)?overdueDays(l)+' days late':''),fineOf(l),num(l.paid),num(l.waived),balOf(l),isActive(l)?'Accruing':balOf(l)>0?'Unpaid':'Settled']));
  if(k==='holds') rows=[['Book','Member','Placed','Status']].concat(holds().map(h=>[bTitle(h.bookId),mName(h.memberId),isoDate(h.createdAt),h.status]));
  giveFile(`library-${k}-${d}.csv`, csv(rows)); }
function importForm(){ UI.imp=null; openModal('Import books from CSV', `<p style="margin-top:0" class="note">The first row must be column headings. Recognised columns: <b>title</b>, <b>author</b>, isbn, category, publisher, year, edition, shelf, copies, price. Books whose ISBN is already in the catalog are skipped.</p>
  <input type="file" accept=".csv,text/csv" id="impFile"><div id="impPrev" style="margin-top:12px"></div>
  <div class="form-actions"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="do-import" id="impBtn" disabled>Import</button></div>`); }
async function readImport(file){ const text=await file.text(); const rows=parseCSV(text); const box=$('#impPrev'); if(rows.length<2) return box.innerHTML='<div class="err">No data rows found.</div>';
  const hdr=rows[0].map(h=>h.trim().toLowerCase().replace(/[^a-z]/g,'')); const ix=k=>hdr.findIndex(h=>h===k||h.startsWith(k));
  const map={title:ix('title'),author:ix('author'),isbn:ix('isbn'),category:ix('categ'),publisher:ix('publish'),year:ix('year'),edition:ix('edition'),shelf:ix('shelf'),copies:ix('cop'),price:ix('price')};
  if(map.title<0) return box.innerHTML='<div class="err">Couldn’t find a “title” column.</div>';
  const clean=s=>String(s||'').replace(/[-\s]/g,'').toLowerCase(); const have=new Set(books().map(b=>clean(b.isbn)).filter(Boolean)); const items=[]; let skip=0;
  rows.slice(1).forEach(r=>{ const g=k=>map[k]>=0?(r[map[k]]||'').trim():''; if(!g('title')) return; const isbn=g('isbn'); if(isbn&&have.has(clean(isbn))){ skip++; return; } if(isbn) have.add(clean(isbn));
    items.push({title:g('title'),author:g('author')||'Unknown',isbn,category:g('category'),publisher:g('publisher'),year:g('year'),edition:g('edition'),shelf:g('shelf'),copies:Math.max(0,Math.round(num(g('copies'),1)))||1,price:num(g('price'))}); });
  UI.imp=items; box.innerHTML=`<div class="box"><b>${items.length}</b> books ready to import${skip?`, ${skip} skipped (ISBN already in catalog)`:''}.${items.length?`<div class="note">First: ${esc(items[0].title)} — ${esc(items[0].author)}</div>`:''}</div>`; $('#impBtn').disabled=!items.length; }
async function runBulk(label, ops){ if(!ready()) return; const t=toast(label+'… 0/'+ops.length,'ok',600000); let ok=0;
  for(let i=0;i<ops.length;i++){ if(await ops[i]()) ok++; else if(mode==='cloud'&&i===0) break; t.textContent=`${label}… ${i+1}/${ops.length}`; } t.remove(); return ok; }
async function doImport(){ const items=UI.imp||[]; closeModal(); let n=parseInt(nextCode('books','B').slice(1),10);
  const ok=await runBulk('Importing books', items.map(it=>()=>put('books',{...it,id:uid(),code:'B'+String(n++).padStart(4,'0'),addedAt:nowISO()}))); if(ok!==undefined) toast(`Imported ${ok} books.`); }

    AUTH.user=res; setSession(res,remember); if(res.kind==='staff') put('users',{...S.users[res.id],lastLoginAt:nowISO()}); enterApp();

FORMS.setup=async fd=>{ const err=$('#lerr'); const pw=String(fd.get('password')), c=String(fd.get('confirm'));
  if(pw.length<6) return err.textContent='Password must be at least 6 characters.'; if(pw!==c) return err.textContent='Passwords don’t match.';
  const name=String(fd.get('name')).trim(), username=String(fd.get('username')).trim(), lib=String(fd.get('libraryName')).trim()||'My Library';
  if(mode==='server'){ const r=await fetch('api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,username,password:pw,libraryName:lib})}); const d=await r.json().catch(()=>({}));
    if(!r.ok) return err.textContent=d.error||'Setup failed.'; setToken(d.token,true); AUTH.user=d.user; await pullServer(); enterApp(); return toast('Your library is ready. Welcome!'); }
  const user={id:uid(),username,name,role:'admin',active:true,createdAt:nowISO(),lastLoginAt:nowISO(),...await passwordFields(pw)};
  if(!await put('users',user)) return err.textContent='Couldn’t save the account. Please try again.';
  await saveSettings({...S.settings,libraryName:lib}); AUTH.user={kind:'staff',id:user.id,role:'admin',name}; setSession(AUTH.user,true); enterApp(); toast('Your library is ready. Welcome!'); };
FORMS.user=async fd=>{ const err=$('#ferr'); const id=fd.get('id'), old=id?S.users[id]:null, self=id===AUTH.user.id;
  const username=String(fd.get('username')).trim(), pw=String(fd.get('password')||''); const role=self?old.role:fd.get('role'), active=self?true:fd.get('active')==='1';
  if(Object.values(S.users).some(u=>u.id!==id&&(u.username||'').toLowerCase()===username.toLowerCase())) return err.textContent='That username is taken.';
  if(old&&old.role==='admin'&&(role!=='admin'||!active)&&!activeAdmins(id)) return err.textContent='You need at least one active administrator.';
  if(pw&&pw.length<6) return err.textContent='Password must be at least 6 characters.';
  const o={...(old||{}),id:id||uid(),username,name:String(fd.get('name')).trim(),role,active,createdAt:old?.createdAt||nowISO()}; if(pw) Object.assign(o,await passwordFields(pw));
  closeModal(); if(await put('users',o)){ toast(old?'Account updated.':`Account created — ${o.name} can now sign in as “${username}”.`,'ok',5000); if(self){ AUTH.user.name=o.name; applyRole(); } } };
FORMS.changepw=async fd=>{ const err=$('#ferr'); const cur=String(fd.get('current')), nx=String(fd.get('next')), c=String(fd.get('confirm'));
  if(nx.length<6) return err.textContent='New password must be at least 6 characters.'; if(nx!==c) return err.textContent='New passwords don’t match.';
  if(mode==='server'){ const r=await fetch('api/password',{method:'POST',headers:authHeaders(),body:JSON.stringify({current:cur,next:nx})}); const d=await r.json().catch(()=>({}));
    if(!r.ok) return err.textContent=d.error||'Couldn’t change the password.'; closeModal(); return toast('Password changed.'); }
  const col=AUTH.user.kind==='staff'?'users':'members', rec=S[col][AUTH.user.id]; if(!rec||await hashPw(cur,rec.pwSalt)!==rec.pwHash) return err.textContent='Current password is wrong.';
  closeModal(); if(await put(col,{...rec,...await passwordFields(nx)})) toast('Password changed.'); };
FORMS.ownerreset=async fd=>{ const u=S.users[fd.get('id')], pw=String(fd.get('password')); if(!u) return; if(pw.length<6) return $('#ferr').textContent='At least 6 characters.';
  closeModal(); if(await put('users',{...u,active:true,...await passwordFields(pw)})) toast(`Password reset for ${u.username}. You can sign in now.`,'ok',5000); };

async function loadSample(){ if(!ready()) return; let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647; const pick=a=>a[Math.floor(rnd()*a.length)];
  const BK=[['To Kill a Mockingbird','Harper Lee','Fiction',1960,3,399],['Nineteen Eighty-Four','George Orwell','Fiction',1949,3,299],['The God of Small Things','Arundhati Roy','Fiction',1997,2,450],['Midnight’s Children','Salman Rushdie','Fiction',1981,2,550],
   ['Wings of Fire','A. P. J. Abdul Kalam','Biography',1999,4,250],['The Discovery of India','Jawaharlal Nehru','History',1946,2,499],['Sapiens','Yuval Noah Harari','History',2011,3,599],['A Brief History of Time','Stephen Hawking','Science',1988,2,399],
   ['The Selfish Gene','Richard Dawkins','Science',1976,1,499],['Introduction to Algorithms','Cormen, Leiserson, Rivest & Stein','Computer Science',2009,2,1295],['Clean Code','Robert C. Martin','Computer Science',2008,2,799],['The Pragmatic Programmer','Andrew Hunt & David Thomas','Computer Science',1999,1,899],
   ['Atomic Habits','James Clear','Self-help',2018,3,499],['Thinking, Fast and Slow','Daniel Kahneman','Psychology',2011,2,599],['Pride and Prejudice','Jane Austen','Classics',1813,2,199],['Godaan','Munshi Premchand','Classics',1936,2,175],
   ['Malgudi Days','R. K. Narayan','Fiction',1943,3,250],['Concepts of Physics, Vol. 1','H. C. Verma','Science',1992,4,450],['The Alchemist','Paulo Coelho','Fiction',1988,1,350],['Gitanjali','Rabindranath Tagore','Poetry',1910,2,150]];
  const MB=[['Aarav Mehta','Student'],['Diya Iyer','Student'],['Rohan Gupta','Student'],['Ananya Reddy','Faculty'],['Vikram Nair','Faculty'],['Kabir Singh','Public'],['Meera Joshi','Staff'],['Ishaan Kapoor','Student'],['Sneha Patel','Public'],['Arjun Das','Student']];
  let bn=parseInt(nextCode('books','B').slice(1),10), mn=parseInt(nextCode('members','M').slice(1),10); const now=new Date();
  const bs=BK.map(([title,author,category,year,copies,price],i)=>({id:uid()+i,code:'B'+String(bn++).padStart(4,'0'),title,author,category,year,copies,price,isbn:'',publisher:'',edition:'',shelf:String.fromCharCode(65+i%5)+'-'+(1+i%4),addedAt:addDays(now,-400).toISOString()}));
  const ms=MB.map(([name,type],i)=>({id:uid()+'m'+i,code:'M'+String(mn++).padStart(4,'0'),name,type,status:'Active',email:name.toLowerCase().replace(/[^a-z]+/g,'.')+'@example.com',phone:'98'+String(10000000+Math.floor(rnd()*89999999)),address:'',ref:'',dept:'',notes:'',
    joinedAt:addDays(now,-380+i*10).toISOString(),expiresAt:(i===9?addDays(now,-5):addDays(now,200+i*15)).toISOString()}));
  const ls=[]; for(let i=0;i<26;i++){ const b=pick(bs), m=pick(ms.slice(0,9)); const iss=addDays(now,-(30+Math.floor(rnd()*300))); const due=addDays(iss,14); const ret=addDays(iss,5+Math.floor(rnd()*16));
    const l={id:uid()+'l'+i,bookId:b.id,memberId:m.id,issuedAt:iss.toISOString(),dueAt:due.toISOString(),returnedAt:ret.toISOString(),renewals:0,payments:[],waived:0,damage:0};
    l.fine=Math.max(0,Math.round((sod(ret)-sod(due))/DAY))*num(S.settings.finePerDay); l.late=l.fine; l.paid=rnd()<.8?l.fine:0; ls.push(l); }
  const act=[[0,0,20],[1,1,6],[2,4,18],[3,12,9],[4,6,25],[5,18,3],[6,2,16],[7,10,11],[8,9,4]];
  act.forEach(([mi,bi,d],i)=>{ const iss=addDays(now,-d); ls.push({id:uid()+'a'+i,bookId:bs[bi].id,memberId:ms[mi].id,issuedAt:iss.toISOString(),dueAt:addDays(iss,14).toISOString(),returnedAt:null,renewals:0,fine:0,paid:0,waived:0,payments:[]}); });
  // "The Alchemist" (1 copy) is out — two members waiting
  const al=bs[18]; ls.push({id:uid()+'x',bookId:al.id,memberId:ms[3].id,issuedAt:addDays(now,-8).toISOString(),dueAt:addDays(now,6).toISOString(),returnedAt:null,renewals:0,fine:0,paid:0,waived:0,payments:[]});
  const hs=[{id:uid()+'h1',bookId:al.id,memberId:ms[1].id,createdAt:addDays(now,-3).toISOString(),status:'waiting'},{id:uid()+'h2',bookId:al.id,memberId:ms[7].id,createdAt:addDays(now,-1).toISOString(),status:'waiting'}];
  const ops=[...bs.map(o=>()=>put('books',o)),...ms.map(o=>()=>put('members',o)),...ls.map(o=>()=>put('loans',o)),...hs.map(o=>()=>put('reservations',o))];
  const ok=await runBulk('Loading sample data', ops); if(ok!==undefined) toast(`Sample library loaded (${ok} records).`); }

/* ================= Event wiring ================= */
document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-act]'); if(!el){ if(e.target.id==='modal') closeModal(); return; }
  const a=el.dataset.act, id=el.dataset.id;
  switch(a){
    case 'close': closeModal(); break;
    case 'confirm-yes': { const cb=confirmCb; confirmCb=null; closeModal(); if(cb) await cb(); break; }
    case 'page': UI.pages[el.dataset.k]=+el.dataset.p; refresh(); break;
    case 'add-book': bookForm(); break;
    case 'edit-book': bookForm(B(id)); break;
    case 'book-info': bookInfo(id); break;
    case 'add-member': memberForm(); break;
    case 'edit-member': memberForm(M(id)); break;
    case 'member-info': memberInfo(id); break;
    case 'issue-book': closeModal(); go('circulation',{book:B(id).code+' — '+B(id).title}); setTimeout(()=>$('#imem')?.focus(),50); break;
    case 'issue-member': closeModal(); go('circulation',{member:M(id).code+' — '+M(id).name}); setTimeout(()=>$('#ibook')?.focus(),50); break;
    case 'issue-hold': { const h=S.reservations[id]; if(h&&B(h.bookId)&&M(h.memberId)) go('circulation',{book:B(h.bookId).code+' — '+B(h.bookId).title,member:M(h.memberId).code+' — '+M(h.memberId).name}); break; }
    case 'return': { const l=S.loans[id]; if(l) returnForm(l); break; }
    case 'renew': await doRenew(id); break;
    case 'lost': { const l=S.loans[id]; if(l) lostForm(l); break; }
    case 'pay': { const l=S.loans[id]; if(l) payForm(l); break; }
    case 'waive': { const l=S.loans[id]; if(!l) break; const b=balOf(l);
      confirmBox('Waive fine?', `Waive the remaining <b>${money(b)}</b> owed by ${esc(mName(l.memberId))}?`, 'Waive', async()=>{ if(await put('loans',{...l,waived:num(l.waived)+b})) toast('Fine waived.'); }, false); break; }
    case 'add-hold': holdForm(); break;
    case 'hold-book': holdForm({b:id}); break;
    case 'hold-member': holdForm({m:id}); break;
    case 'hold-pair': holdForm({m:el.dataset.m,b:el.dataset.b}); break;
    case 'cancel-hold': { const h=S.reservations[id]; if(!h) break; confirmBox('Cancel reservation?', `Cancel ${esc(mName(h.memberId))}’s reservation for “${esc(bTitle(h.bookId))}”?`, 'Cancel reservation', async()=>{ const wasReady=h.status==='ready'; if(await put('reservations',{...h,status:'cancelled',closedAt:nowISO()})){ toast('Reservation cancelled.'); if(wasReady) await promote(h.bookId); } }); break; }
    case 'expire-holds': { const ex=holds().filter(holdExpired); if(!ex.length){ toast('No pickups have expired.'); break; }
      for(const h of ex) await put('reservations',{...h,status:'expired',closedAt:nowISO()}); for(const bid of new Set(ex.map(h=>h.bookId))) await promote(bid); toast(`Released ${ex.length} expired pickup(s).`); break; }
    case 'renew-member': { const m=M(id); const base=new Date(Math.max(Date.now(),sod(m.expiresAt||Date.now()))); const exp=new Date(base); exp.setFullYear(exp.getFullYear()+num(S.settings.memberYears,1));
      if(await put('members',{...m,expiresAt:exp.toISOString()})){ toast(`Membership renewed until ${fmt(exp)}.`); memberInfo(id); } break; }
    case 'toggle-suspend': { const m=M(id); const st=m.status==='Suspended'?'Active':'Suspended'; if(await put('members',{...m,status:st})){ toast(st==='Active'?'Member reactivated.':'Member suspended.'); memberInfo(id); } break; }
    case 'del-book': { const b=B(id); if(onLoan(id)) { toast(`Can’t delete — ${onLoan(id)} copies are on loan.`,'err'); break; }
      confirmBox('Delete book?', `Delete “${esc(b.title)}” from the catalog? Its loan history is kept.`, 'Delete', async()=>{ for(const h of holds().filter(h=>h.bookId===id&&['waiting','ready'].includes(h.status))) await put('reservations',{...h,status:'cancelled',closedAt:nowISO()}); if(await del('books',id)) toast('Book deleted.'); }); break; }
    case 'del-member': { const m=M(id); if(memberLoans(id).length){ toast('Can’t delete — this member still has books on loan.','err'); break; } if(memberBal(id)>0){ toast(`Can’t delete — ${money(memberBal(id))} in fines is unpaid. Collect or waive it first.`,'err',5000); break; }
      confirmBox('Delete member?', `Delete ${esc(m.name)} (${esc(m.code)})? Their loan history is kept. Consider suspending instead.`, 'Delete', async()=>{ for(const h of holds().filter(h=>h.memberId===id&&['waiting','ready'].includes(h.status))){ await put('reservations',{...h,status:'cancelled',closedAt:nowISO()}); if(h.status==='ready') await promote(h.bookId); } if(await del('members',id)) toast('Member deleted.'); }); break; }
    case 'import-books': importForm(); break;
    case 'do-import': await doImport(); break;
    case 'exp': exportCSV(el.dataset.k); break;
    case 'backup': backup(); break;
    case 'copy-exp': try{ await navigator.clipboard.writeText($('#exptext').value); toast('Copied to clipboard.'); }catch(err){ $('#exptext').select(); toast('Press Ctrl/⌘+C to copy the selected text.'); } break;
    case 'sample': if(books().length||members().length) confirmBox('Load sample data?','This adds 20 demo books, 10 members and about 36 loans alongside your existing data.','Load sample',loadSample,false); else await loadSample(); break;
    case 'wipe': wipeForm(); break;
    case 'auth-tab': showLogin(el.dataset.k); break;
    case 'pw-toggle': { const i=el.parentElement.querySelector('input'); i.type=i.type==='password'?'text':'password'; el.textContent=i.type==='password'?'Show':'Hide'; break; }
    case 'logout': await logout(); break;
    case 'change-pw': changePwForm(); break;
    case 'owner-reset': ownerResetForm(); break;
    case 'add-user': userForm(); break;
    case 'edit-user': userForm(S.users[id]); break;
    case 'del-user': { const u=S.users[id]; if(!u) break; if(u.id===AUTH.user.id){ toast('You can’t delete your own account.','err'); break; } if(u.role==='admin'&&!activeAdmins(id)){ toast('You need at least one active administrator.','err'); break; }
      confirmBox('Delete staff account?', `Delete the account “${esc(u.username)}”? ${esc(u.name||'They')} will no longer be able to sign in.`, 'Delete', async()=>{ if(await del('users',id)) toast('Account deleted.'); }); break; }
    case 'm-hold': await memberHold(id); break;
    case 'm-cancel': { const h=S.reservations[id]; if(!h) break; confirmBox('Cancel reservation?', `Cancel your reservation for “${esc(bTitle(h.bookId))}”?`, 'Cancel reservation', async()=>{ const wasReady=h.status==='ready'; if(await put('reservations',{...h,status:'cancelled',closedAt:nowISO()})){ toast('Reservation cancelled.'); if(mode==='server') pullServer(); else if(wasReady) await promote(h.bookId); } }); break; }
  }
});
document.addEventListener('submit', e=>{ const f=e.target.closest('form[data-form]'); if(!f) return; e.preventDefault(); const fn=FORMS[f.dataset.form]; if(fn) fn(new FormData(f), f); });
document.addEventListener('input', e=>{ const k=e.target.dataset?.in; if(!k) return;
  if(k==='preview') renderPreview(); else if(k==='quick') renderQuick();
  else if(k==='retcalc'){ const tot=(UI.modal?.late||0)+num(e.target.value); const p=$('#retpaid'); if(p) p.value=tot; $('#rettotal').textContent=`Total fine: ${money(tot)}. Any amount not collected stays on the member’s account.`; }
  else { Object.keys(UI.pages).forEach(p=>UI.pages[p]=0); const v=V[UI.route]; if(v) v.update(); } });
document.addEventListener('change', e=>{ if(e.target.id==='impFile'&&e.target.files[0]) readImport(e.target.files[0]); else if(e.target.id==='restoreFile'&&e.target.files[0]){ readBackup(e.target.files[0]); e.target.value=''; }
  else if(e.target.tagName==='SELECT'&&e.target.dataset.in){ Object.keys(UI.pages).forEach(p=>UI.pages[p]=0); V[UI.route]?.update(); } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&!$('#modal').classList.contains('hidden')) closeModal(); });
